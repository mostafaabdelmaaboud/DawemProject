      <span class="title-head">
        ملف الشركة

    </div>
    <div class="container-login mb-4 d-flex justify-content-between align-items-center position-relative">

        <div class="content-login">
          <div class="header text-center">
            <h3 class="title">تحديث الملف الشخصي</h3>
            <p class="sub-text">قم بي تحديث الملف الشخصي للمتابعة</p>
          </div>
          <div class="form">
            <form class="w-100" [formGroup]="FormGroup">

                  <div

                      <input type="file" accept="image/*" (change)="profileImgChooseEvent($event)"
                          class="uploadprofile">
                      <span class="icon-upload" *ngIf="!croppedImage">
                          <i class="pi pi-cloud-upload"></i>
                      </span>
                      <img [src]="croppedImage ? croppedImage : 'assets/img/old_logo.png'"
                          id="profileImage" alt="Profile" class="rounded-circle">
                  </div>
                </div>
              </div>
            
              <div class="col-12">
                <div class="row">

                    <div class="sectionFive mb-3">
                      <label for="" class="label-input mb-2">{{'signup.name' | translate}}</label>
                      <!--Start Custom Validators-->
                      <div class="content-input position-relative disabled-field">
                        <div class="content-password">
                          <input type="text" pInputText formControlName="name" [readOnly]="true" [placeholder]="'signup.enterTheName' | translate" class="w-100" />
                        </div>
                        <!-- <div class="container-alerts" *ngIf="getControl('name')?.errors">
                          <div class="alert alert-danger"

                            {{'signup.nameIsRequired' | translate}} 
                          </div>
                        </div> -->
                      </div>
                      <!--End Custom Validators-->
                    </div>
                  </div>
                  <div class="col-md-6 col-12">
                    <div class="sectionFive mb-3">
                      <label for="" class="label-input mb-2">كود الشركة</label>
                      <!--Start Custom Validators-->
                      <div class="content-input position-relative disabled-field">
                        <div class="content-password">
                          <input type="text" pInputText formControlName="code" [readOnly]="true" [placeholder]="'signup.enterTheName' | translate" class="w-100" />
                        </div>

                        </div>
                  
                      </div>
                      <!--End Custom Validators-->
                    </div>
                  </div>

                  </div>

                            </ng-template>

                              {{ option.name }}

                          </p-dropdown>
                        </div>

  <div class="alert-action " *ngIf="selectImage">
    <div class="card popupCrope alert-card">
        <div class="card-body">
            <div class="row" style="margin-top: 5%; width: 100%; margin: auto;">
                <div class="text-center col-md-7">
                    <h5 class="name">Crop Image</h5>
                    <image-cropper class="cropImage" [imageChangedEvent]="imageChangedEvent"
                        [maintainAspectRatio]="true" [aspectRatio]="4 / 4" [resizeToWidth]="256" format="png"
                        (imageCropped)="imageCropped($event)" (imageLoaded)="imageLoaded()"
                        (cropperReady)="cropperReady()" (loadImageFailed)="loadImageFailed()">
                    </image-cropper>
                </div>
                <div class="text-center col-md-5">
                    <h5 class="name">Preview</h5>
                    <img [src]="croppedImage" class="preview" />
                </div>
            </div>
        </div>
        <div class="card-footer">
            <div class="row justify-content-between">
                <div class="col-6">
                </div>
                <div class="col-6">
                    <div class="d-flex flex-row-reverse">
                        <button type="button" class="btn btn-primary saveCrop" (click)="selectImage = false;">
                            <span class="bottun-span">
                                save
                            </span>
                        </button>
                    </div>
                </div>

            </div>
        </div>
    </div>
</div>
