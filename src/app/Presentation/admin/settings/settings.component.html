<div class="header-comp d-flex align-items-center">
    <span class="title-head">
        الإعدادات
    </span>
    <div class="field-calendar-header">
      <p-calendar [(ngModel)]="date" [showIcon]="true" dateFormat="yy MM"></p-calendar>
  
    </div>
  </div>
  <div class="container-settings">
    <div class="custom-header-table d-flex justify-content-between align-items-center">
        <h2 class="title-table m-0">
            الإعدادات
          <!-- <span class="subTitlte ml-2">(30 FLS )</span> -->
        </h2>
        <div class="custom-filteration d-flex align-items-center">
          <!-- <span class="p-input-icon-left ml-auto">
            <i class="pi pi-search" (click)="searchKeyword(search.value)"></i>
            <input pInputText type="text" #search (input)="dt1.filterGlobal(search.value, 'contains')"
              placeholder="Search..." />
          </span> -->
     
   
          <div class="container-filteration">
     
            <button class="btn btn-primary action-button-t d-flex align-items-center" (click)="createSettings()">
              <!-- <i class="pi bi-plus-circle-fill"></i> -->
              <span> تعديل الإعدادات </span>
            </button>
            <!--
            <button (click)="op.toggle($event)" class="btn button-filter-table">

              <i class="bi bi-filter"></i>
            </button> -->
          </div>
        </div>
      </div>
      <div class="content-settings" [formGroup]="formSettings">
        <ng-container formArrayName="gorup"
        *ngFor="let item of getControlArray('gorup').controls; let parentIndex = index; let odd = odd; let last = last; let first = first">
            <div class="section-groupName" [formGroupName]="parentIndex">
                <div class="fieldset">
                    <label>{{item.value.groupTypeName}}</label>
                    <ng-container formArrayName="settings" 
                    *ngFor="let itemChild of getChildFormArray('settings', parentIndex).controls; let childIndex = index">
                    <div class="content-fieldset mb-3" [formGroupName]="childIndex">
                        <div class="sectionFive  form-groupTypeName d-flex align-items-center">
                            <label for="" class="label-input mb-2 col">{{itemChild.value.settingTypeName}} <span class="color-red">*</span></label>
                            <ng-container *ngIf="itemChild.value.valueType === 0">
                                <div class="content-password col">
                                    <input type="text" class="w-100" pInputText formControlName="settingValue"
                                      [placeholder]="itemChild.value.settingTypeName" class="w-100" />
                                  </div>
                            </ng-container>
                            <ng-container *ngIf="itemChild.value.valueType === 1">
                                <div class="content-password col">
                                    <input type="number" class="w-100" pInputText formControlName="settingValue"
                                      [placeholder]="itemChild.value.settingTypeName" class="w-100" />
                                  </div>
                            </ng-container>
                            <ng-container *ngIf="itemChild.value.valueType === 2">
                                <div class="content-password col">
                                    <input type="number" class="w-100" pInputText formControlName="settingValue"
                                      [placeholder]="itemChild.value.settingTypeName" class="w-100" />
                                  </div>
                            </ng-container>
                            <ng-container *ngIf="itemChild.value.valueType === 3">
                                <div class="content-password col">
                                    <input type="number" class="w-100" pInputText formControlName="settingValue"
                                      [placeholder]="itemChild.value.settingTypeName" class="w-100" />
                                  </div>
                                  <div class="section1 content-password col">
                                    <p-inputSwitch formControlName="settingValue"></p-inputSwitch>
                                  </div>
                            </ng-container>
                           
                    
                          </div>
                                  <!--Start Custom Validators-->
                                  <div class="container-alerts mt-2" *ngIf="getChildFormArray('settings', parentIndex).at(childIndex).get('settingValue')?.errors">
                                    <div class="alert alert-danger"
                                      *ngIf="getChildFormArray('settings', parentIndex).at(childIndex).get('settingValue')?.hasError('required') && getChildFormArray('settings', parentIndex).at(childIndex).get('settingValue')?.dirty">
                                      {{itemChild.value.settingTypeName}} مطلوبة
                                    </div>
                                    <ng-container *ngIf="itemChild.value.valueType === 2">
                                        <div class="alert alert-danger"
                                        *ngIf="getChildFormArray('settings', parentIndex).at(childIndex).get('settingValue')?.hasError('invalidDecimal') && !getChildFormArray('settings', parentIndex).at(childIndex).get('settingValue')?.hasError('required')">
                                        {{itemChild.value.settingTypeName}} يجب ان يكون رقم عشري
                                      </div>
                                    </ng-container>
                                   
                                  </div>
                                  <!--End Custom Validators-->
                    </div>
                    </ng-container>
                 
                </div>

            </div>
        </ng-container>
  
        <div class="container-empty-data p-4 w-100 d-flex justify-content-center align-items-center" *ngIf="emptyData">
            <svg width="65" height="40" viewBox="0 0 65 40" fill="none" xmlns="http://www.w3.org/2000/svg">
              <g clip-path="url(#clip0_1920_5847)">
                <rect width="64" height="40" transform="translate(0.5)" fill="white" fill-opacity="0.01" />
                <path
                  d="M32.5 39.7047C50.1731 39.7047 64.5 36.5939 64.5 32.7566C64.5 28.9193 50.1731 25.8086 32.5 25.8086C14.8269 25.8086 0.5 28.9193 0.5 32.7566C0.5 36.5939 14.8269 39.7047 32.5 39.7047Z"
                  fill="#F5F5F5" />
                <path
                  d="M55.5 13.6653L45.354 2.24866C44.867 1.47048 44.156 1 43.407 1H21.593C20.844 1 20.133 1.47048 19.646 2.24767L9.5 13.6663V22.8367H55.5V13.6653Z"
                  stroke="#CED4DA" />
                <path
                  d="M42.113 16.8116C42.113 15.2185 43.107 13.9033 44.34 13.9023H55.5V31.9047C55.5 34.0119 54.18 35.739 52.55 35.739H12.45C10.82 35.739 9.5 34.011 9.5 31.9047V13.9023H20.66C21.893 13.9023 22.887 15.2155 22.887 16.8086V16.8304C22.887 18.4235 23.892 19.7099 25.124 19.7099H39.876C41.108 19.7099 42.113 18.4116 42.113 16.8185V16.8116Z"
                  fill="#FAFAFA" stroke="#CED4DA" />
              </g>
              <defs>
                <clipPath id="clip0_1920_5847">
                  <rect width="64" height="40" fill="white" transform="translate(0.5)" />
                </clipPath>
              </defs>
            </svg>
            <span class="empty-table f-s-16">No Data</span>
          </div>
      </div>
  </div>
  <div class="spinner d-flex justify-content-center align-items-start" *ngIf="loading">
    <mat-spinner></mat-spinner>
  </div>
