<div class="container-Dialog">
  <header class="header-dialog d-flex justify-content-center align-items-center p-15 position-relative">
    <h3 class="title-Dialog m-0">
      {{data!['title']|translate}}
    </h3>
    <button class="icon-close iconCloseDialog" type="button" (click)="close()">
      <!-- <i class="fa fa-times" aria-hidden="true"></i> -->
      <i class="pi pi-times-circle"></i>
    </button>
  </header>
  <div class="body-dialog p-15 f-s-16">
    <div class="sectionTwo mb-3 line-bellow">
      <label class="title">{{"holidays.setAsActive"|translate}}</label>
      <div class="content-password">
        <ng-container *ngIf="info?.isActive">
          {{"employees.active"|translate}}
        </ng-container>
        <ng-container *ngIf="!info?.isActive">
          {{"employees.Inactive"|translate}}
        </ng-container>
      </div>

    </div>
    <!-- <div class="sectionTwo mb-3 line-bellow">
      <label class="title"> اسم نوع الجدولة</label>
      <div class="content-password">
        {{info?.schedulePlanTypeName ? info?.schedulePlanTypeName : "لا يوجد"}}
      </div>

    </div> -->
    <div class="sectionTwo mb-3 line-bellow">
      <label class="title"> {{info?.schedulePlanTypeName}}</label>
      <div class="content-password" *ngIf="info?.departmentName != null">
        {{info?.departmentName}}
      </div>
      <div class="content-password" *ngIf="info?.employeeName != null">
        {{info?.employeeName}}
      </div>
      <div class="content-password" *ngIf="info?.groupName != null">
        {{info?.groupName}}
      </div>
    </div>

    <div class="sectionTwo mb-3 line-bellow">
      <label class="title">{{"schedualPlan.scheduleName"|translate}}</label>
      <div class="content-password">
        <ng-container *ngIf="info?.scheduleName">
          {{info?.scheduleName}}
        </ng-container>
        <ng-container *ngIf="!info?.scheduleName">
          {{"department.nothing"|translate}}
        </ng-container>
      </div>

    </div>

    <div class="sectionTwo mb-3 line-bellow">
      <label class="title"> {{"schedualPlan.notes"|translate}}</label>
      <div class="content-password">
        <ng-container *ngIf="info?.notes">
          {{info?.notes}}
        </ng-container>
        <ng-container *ngIf="!info?.notes">
          {{"department.nothing"|translate}}
        </ng-container>
      </div>

    </div>

  </div>

</div>

<div class="spinner-dialog d-flex justify-content-center align-items-center loading" *ngIf="loading">
  <mat-spinner></mat-spinner>
</div>
