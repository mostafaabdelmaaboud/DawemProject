<div class="container-Dialog">

  <div class="body-dialog p-15 f-s-16">
    <div class="big-icon">
      <img src="assets/img/2.png" alt="">
    </div>
    <div class="container-desc">
      <label class="title">
        {{data!['title'] | translate}}
      </label>
      <p class="pt-2 m-0">
        {{data!['message'] | translate}}
      </p>
    </div>

    <div class="sectionFive" [formGroup]="dialogCloseForm">
      <label for="" class="label-input mb-2" [innerHTML]="data!['titleReasonOfRefuse']|translate"></label>
      <div class="content-password">
        <input type="text" pInputText formControlName="notes"
          [placeholder]="data!['placeholdeReasonOfRefuse']|translate" class="w-100" />
      </div>

    </div>

  </div>
  <footer class="footer-dialog p-15 d-flex justify-content-end">
    <button class="background-red w-100 color-white mr-2 b-r-4 button-action ml-2 mr-2 f-s-16"
      (click)="request()">{{submitted ?
      (data!['buttonSend']|translate) : ('dialogs.loading'|translate)}}</button>
    <button class="btn-outline-primary w-100 ml-2  b-r-4 button-action-two ml-2 mr-2 f-s-16"
      (click)="close()">{{data!['titleClose']|translate}}</button>

  </footer>
</div>
<div class="spinner-dialog d-flex justify-content-center align-items-center loading" *ngIf="!submitted">
  <mat-spinner></mat-spinner>
</div>
