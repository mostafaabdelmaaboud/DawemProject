<div class="container-Dialog">
  <header class="header-dialog d-flex justify-content-center align-items-center p-15 position-relative">
    <h3 class="title-Dialog m-0">
      {{data!['title']|translate}}
    </h3>
    <button class="icon-close iconCloseDialog" type="button" (click)="close()">
      <!-- <i class="fa fa-times" aria-hidden="true"></i> -->
      <i class="pi pi-times-circle"></i>
    </button>
  </header>
  <div class="body-dialog p-15 f-s-16">
    <div class="sectionTwo mb-3 line-bellow">
      <label class="title">{{'zones.theNumber' | translate}}</label>
      <div class="content-password">
        <ng-container *ngIf="info?.code">{{info?.code}}</ng-container>
        <ng-container *ngIf="!info?.code">{{'department.nothing' | translate}}</ng-container>

      </div>

    </div>
    <div class="sectionTwo mb-3 line-bellow">
      <label class="title">{{'justifications.setAsEssential' | translate}}</label>
      <div class="content-password">
        <ng-container *ngIf="info?.isActive">{{info?.isActive}}</ng-container>
        <ng-container *ngIf="!info?.isActive">{{'department.nothing' | translate}}</ng-container>
      </div>

    </div>
    <div class="sectionTwo mb-3 line-bellow">
      <label class="title"> {{'users.theName' | translate}}</label>
      <div class="content-password">
        <ng-container *ngIf="info?.name">{{info?.name}}</ng-container>
        <ng-container *ngIf="!info?.name">{{'department.nothing' | translate}}</ng-container>
      </div>

    </div>
  </div>

  <div class="spinner-dialog d-flex justify-content-center align-items-center loading" *ngIf="loading">
    <mat-spinner></mat-spinner>
  </div>
