<div class="container-Dialog">
  <header class="header-dialog d-flex justify-content-center align-items-center p-15 position-relative">
    <h3 class="title-Dialog m-0">
      {{data!['title']|translate}}

    </h3>
    <button class="icon-close iconCloseDialog" type="button" (click)="close()">
      <!-- <i class="fa fa-times" aria-hidden="true"></i> -->
      <i class="pi pi-times-circle"></i>
    </button>
  </header>
  <div class="body-dialog p-15 f-s-16">
    <form [formGroup]="addBranchGroupForm">
      <div class="sectionFive mb-3">
        <label for="" class="label-input mb-2" [innerHTML]="data!['titleTableName']|translate"></label>
        <div class="content-password">
          <input type="text" pInputText formControlName="tableName"
            [placeholder]="data!['placeholdetableName']|translate" class="w-100" />
        </div>
        <!--Start Custom Validators-->
        <div class="container-alerts mt-2" *ngIf="getControl('tableName')?.errors">
          <div class="alert alert-danger"
            *ngIf="getControl('tableName')?.hasError('required') && getControl('tableName')?.dirty">
            {{data!['ValidationTableName']|translate}}
          </div>
        </div>
        <!--End Custom Validators-->
      </div>
      <div class="col-12">
        <div class="row" formArrayName="weekDays">
          <div class="col-lg-6 col-12" *ngFor="let day of getFormArray().controls; index as i">
            <div class="sectionTwo mb-3" [formGroupName]="i">
              <label class="title">{{day?.value?.name}}</label>
              <div class="content-password">
                <ng-container *ngIf="list[i].weekDay === day?.value?.weekDay">
                  <p-dropdown appendTo="body" formControlName="weekDayValue" [options]="list[i].data"
                    [placeholder]="'tables.chooseThePink' | translate" optionLabel="name">
                    <ng-template pTemplate="header">
                      <span class="p-input-icon-left input-search-dropdown">

                        <i class="pi pi-search"
                          (click)="searchDropdown(searchdirectManager.value, 'weekDayValue', day?.value?.weekDay)"></i>
                        <input type="text" [placeholder]="'requests.search' | translate" pInputText #searchdirectManager />
                      </span>
                    </ng-template>
                    <ng-template let-option pTemplate="item">
                      {{ option.name }}
                    </ng-template>
                  </p-dropdown>
                </ng-container>


              </div>

            </div>
          </div>

        </div>
      </div>
    </form>

    <!-- <form [formGroup]="addBranchGroupForm">
            <ng-container *ngIf="data?.subTitle">
                <div class="mb-3" [innerHTML]="data!['subTitle']!|translate"></div>
            </ng-container>
            <div class="li-input col-12" *ngFor="let input of data?.addBranchesInputsProps">
                <label for="" class="label-input mb-2" [innerHTML]="input['LabelMessage']|translate"></label>
                <div class="content-password">


                    <input [formControlName]="input.name" pInputText class="w-100" [type]="input.inputType" required
                        [name]="input.name" />
                </div>
                <div class="container-alerts" *ngIf="getControl(input.name)?.errors">
                    <div class="alert alert-danger"
                        *ngIf="getControl(input.name)?.hasError('required') && getControl(input.name)?.dirty">
                        {{input['message']|translate}}
                    </div>
                </div>
            </div>
        </form> -->

  </div>
  <footer class="footer-dialog p-15 d-flex justify-content-end">
    <button class="background-blue w-100 color-white b-r-4 button-action ml-2 mr-2 f-s-16"
      (click)="request()">{{submitted
      ?
      (data!['buttonSend']|translate) : ('dialogs.loading'|translate)}}</button>
    <button class="btn-outline-primary w-100 ml-2  b-r-4 button-action-two ml-2 mr-2 f-s-16"
      (click)="close()">{{data!['titleClose']|translate}}</button>
  </footer>
</div>
<div class="spinner-dialog d-flex justify-content-center align-items-center loading" *ngIf="loading">
  <mat-spinner></mat-spinner>
</div>
