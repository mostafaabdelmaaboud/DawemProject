<div class="container-Dialog">
  <header class="header-dialog d-flex justify-content-center align-items-center p-15 position-relative">
    <h3 class="title-Dialog m-0">
      {{data!['title']|translate}}
    </h3>
    <button class="icon-close iconCloseDialog" type="button" (click)="close()">
      <!-- <i class="fa fa-times" aria-hidden="true"></i> -->
      <i class="pi pi-times-circle"></i>
    </button>
  </header>
  <div class="body-dialog p-15 f-s-16">
    <div class="sectionTwo mb-3 line-bellow">
      <label class="title">تعيين كنشط</label>
      <div class="content-password">
        {{info?.isActive ? 'نشط' : 'غير نشط'}}
      </div>

    </div>
    <div class="sectionTwo mb-3 line-bellow">
      <label class="title">اسم المجموعة</label>
      <div class="content-password">
        {{info?.name ? info?.name : "لا يوجد"}}
      </div>

    </div>
    <div class="sectionTwo mb-3 line-bellow">
      <label class="title">موظفي المجموعة</label>
      <div class="content-password">
        <ng-container *ngFor="let employee of info?.employees">
          <span class="d-block mb-2">
            {{employee ? employee : "لا يوجد"}}
          </span>
        </ng-container>


      </div>

    </div>
    <div class="sectionTwo mb-3 line-bellow">
      <label class="title">مدير المجموعة</label>
      <div class="content-password">
        <ng-container *ngFor="let zone of info?.zones">
          <span class="d-block mb-2">
            {{zone ? zone : "لا يوجد"}}
          </span>
        </ng-container>
      </div>

    </div>
    <div class="sectionTwo mb-3 line-bellow">
      <label class="title">نواب المدير</label>
      <div class="content-password">
        <ng-container *ngFor="let manager of info?.managerDelegators">
          <span class="d-block mb-2">
            {{manager ? manager : "لا يوجد"}}
          </span>
        </ng-container>
      </div>

    </div>


  </div>

</div>

<div class="spinner-dialog d-flex justify-content-center align-items-center loading" *ngIf="loading">
  <mat-spinner></mat-spinner>
</div>
